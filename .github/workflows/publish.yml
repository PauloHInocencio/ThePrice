name: Publish to Play Store

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew


    - name: Create local.properties
      env:
        API_BASE_URL: ${{ vars.API_BASE_URL }}
        API_KEY: ${{ secrets.API_KEY }}
        GOOGLE_AUTH_CLIENT_ID_SERVER: ${{ secrets.GOOGLE_AUTH_CLIENT_ID_SERVER }}
        GOOGLE_AUTH_CLIENT_ID_DESKTOP: ${{ secrets.GOOGLE_AUTH_CLIENT_ID_DESKTOP }}
        GOOGLE_AUTH_CLIENT_ID_IOS: ${{ secrets.GOOGLE_AUTH_CLIENT_ID_IOS }}
        GOOGLE_AUTH_IOS_REDIRECT_URI: ${{ secrets.GOOGLE_AUTH_IOS_REDIRECT_URI }}
        GOOGLE_AUTH_CLIENT_SECRET_DESKTOP: ${{ secrets.GOOGLE_AUTH_CLIENT_SECRET_DESKTOP }}
      run: |
        echo "API_BASE_URL=$API_BASE_URL" > local.properties
        echo "API_KEY=$API_KEY" >> local.properties
        echo "GOOGLE_AUTH_CLIENT_ID_SERVER=$GOOGLE_AUTH_CLIENT_ID_SERVER" >> local.properties
        echo "GOOGLE_AUTH_CLIENT_ID_DESKTOP=$GOOGLE_AUTH_CLIENT_ID_DESKTOP" >> local.properties
        echo "GOOGLE_AUTH_CLIENT_SECRET_DESKTOP=$GOOGLE_AUTH_CLIENT_SECRET_DESKTOP" >> local.properties
        echo "GOOGLE_AUTH_CLIENT_ID_IOS=GOOGLE_AUTH_CLIENT_ID_IOS" >> local.properties
        echo "GOOGLE_AUTH_IOS_REDIRECT_URI=GOOGLE_AUTH_IOS_REDIRECT_URI" >> local.properties
        

    - name: Restore google-services.js
      env:
        GS_JSON_BASE64: ${{ secrets.GS_JSON_BASE64 }}
      run: |
        echo "$GS_JSON_BASE64" | base64 --decode > google-services.json
        mv google-services.json composeApp/google-services.json 

    - name: Compute version
      id: version
      run: |
        MAJOR_MINOR=$(grep '^versionMajorMinor=' gradle.properties | cut -d'=' -f2 | tr -d ' \r')
        echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
        echo "name=${MAJOR_MINOR}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

    - name: Build Release Bundle
      run: ./gradlew :composeApp:bundleRelease -PappVersionName=${{ steps.version.outputs.name }} -PappVersionCode=${{ steps.version.outputs.code }}

    - name: Sign Release
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: composeApp/build/outputs/bundle/release
        signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}

    - name: Upload to Play Store
      uses: r0adkll/upload-google-play@v1.1.3
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
        packageName: br.com.noartcode.theprice
        releaseFiles: composeApp/build/outputs/bundle/release/composeApp-release.aab
        track: alpha
        status: completed

    - name: Tag shipped version
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "v${{ steps.version.outputs.name }}" --target "$GITHUB_SHA" --title "v${{ steps.version.outputs.name }}" --generate-notes

    - name: Delete local.properties
      if: always()
      run: rm -f local.properties